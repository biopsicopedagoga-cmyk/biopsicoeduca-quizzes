<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Você percebeu isso? Antigo Testamento | Biopsicoeduca</title>
  <meta name="description" content="Quiz dos detalhes bíblicos com 20 perguntas, explicações e referências.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f5b800'/%3E%3Cpath d='M13 17h18c5 0 9 4 9 9v25c-2-3-5-4-9-4H13z' fill='white'/%3E%3Cpath d='M51 17H33c-5 0-9 4-9 9v25c2-3 5-4 9-4h18z' fill='white' opacity='.9'/%3E%3C/svg%3E">
  <style>
    :root{--yellow:#f5b800;--ink:#171717;--muted:#686868;--paper:#fffdf4;--green:#198754;--red:#c83b38}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(145deg,#fff8d6,#fff 55%);color:var(--ink);min-height:100vh}
    .wrap{max-width:760px;margin:auto;padding:22px 16px 36px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px;margin-bottom:20px}.mark{width:38px;height:38px;border-radius:11px;background:var(--yellow);display:grid;place-items:center;font-size:22px}
    .card{background:#fff;border:1px solid #eadfba;border-radius:24px;box-shadow:0 16px 42px #4a3a0018;padding:clamp(22px,5vw,42px)}
    .eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7a5b00}.progress-row{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.92rem;margin:12px 0 8px}.track{height:10px;background:#f1ead2;border-radius:99px;overflow:hidden}.bar{height:100%;width:5%;background:var(--yellow);transition:.3s}
    h1{font-size:clamp(1.65rem,5vw,2.55rem);line-height:1.1;margin:16px 0 8px}h2{font-size:clamp(1.25rem,3.5vw,1.65rem);line-height:1.35;margin:28px 0 18px}.lead{color:var(--muted);line-height:1.55;margin:0 0 24px}
    .answers{display:grid;gap:11px}.answer{width:100%;text-align:left;border:2px solid #e8e1ca;background:#fff;padding:15px 16px;border-radius:14px;font-size:1rem;cursor:pointer;transition:.15s}.answer:hover,.answer:focus{border-color:var(--yellow);outline:none;transform:translateY(-1px)}.answer.correct{border-color:var(--green);background:#eaf8f0}.answer.wrong{border-color:var(--red);background:#fff0ef}.answer:disabled{cursor:default;transform:none;color:var(--ink)}
    .feedback{display:none;margin-top:18px;padding:16px;border-left:5px solid var(--yellow);background:var(--paper);border-radius:10px;line-height:1.5}.feedback.show{display:block}.ref{font-weight:700}.next,.restart{display:none;margin:18px 0 0 auto;border:0;background:var(--ink);color:#fff;padding:13px 20px;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer}.next.show,.restart.show{display:block}.result{text-align:center;padding:12px 0}.score-big{font-size:3.5rem;font-weight:900;color:#9a7100;margin:8px 0}.copyright{margin:22px auto 0;text-align:center;color:#666;font-size:.78rem;line-height:1.45;max-width:650px}
    @media(max-width:520px){.card{border-radius:18px;padding:22px 18px}.answer{padding:14px}}
  </style>
</head>
<body><main class="wrap"><div class="brand"><span class="mark">📖</span>Biopsicoeduca</div><section class="card" id="app"></section><footer class="copyright">Autoria: Profa. Fran Narnib Lorenzon · Biopsicoeduca — 2026<br>© 2026 Biopsicoeduca — Profa. Fran Narnib Lorenzon. Todos os direitos reservados. Proibida a reprodução, redistribuição, adaptação ou comercialização deste material, no todo ou em parte, sem autorização prévia da autora.</footer></main>
<script>
const questions=[["Qual profeta pediu que trouxessem um músico antes de profetizar?", ["Elias", "Eliseu", "Isaías", "Jeremias"], 1, "Eliseu pediu um músico e, enquanto ele tocava, a mão do Senhor veio sobre o profeta.", "2 Reis 3:15"], ["De quem a Bíblia registra o peso do cabelo cortado anualmente?", ["Sansão", "Absalão", "Saul", "Samuel"], 1, "O cabelo de Absalão era tão abundante que o texto registra seu peso quando era cortado.", "2 Samuel 14:26"], ["Qual rei recebeu uma carta ameaçadora e a estendeu diante do Senhor no templo?", ["Josias", "Ezequias", "Salomão", "Asa"], 1, "Ezequias levou a carta enviada pelos assírios ao templo e a apresentou a Deus em oração.", "2 Reis 19:14"], ["Qual objeto de ferro sobrenaturalmente flutuou na água?", ["Uma espada", "Uma lança", "Um machado", "Uma corrente"], 2, "O ferro de um machado caiu na água e Eliseu fez com que ele flutuasse.", "2 Reis 6:5–7"], ["Debaixo de que Raabe escondeu os espias israelitas?", ["Sacos de trigo", "Ramos de oliveira", "Talos de linho", "Peles de animais"], 2, "Raabe levou os homens ao terraço e os escondeu debaixo de talos de linho.", "Josué 2:6"], ["Quem cortou secretamente um pedaço do manto do rei Saul?", ["Jônatas", "Samuel", "Davi", "Abner"], 2, "Davi teve oportunidade de matar Saul, mas apenas cortou a ponta de seu manto.", "1 Samuel 24:4"], ["Qual mulher matou Sísera usando uma estaca da tenda?", ["Débora", "Jael", "Abigail", "Mical"], 1, "Jael matou Sísera enquanto ele dormia, cumprindo a previsão de que a honra da vitória seria entregue a uma mulher.", "Juízes 4:21"], ["Qual juiz de Israel é apresentado especificamente como canhoto?", ["Gideão", "Jefté", "Eúde", "Sansão"], 2, "Eúde era canhoto e utilizou essa característica na estratégia contra o rei Eglom.", "Juízes 3:15–21"], ["Quem ficou aleijado dos dois pés depois de cair quando ainda era criança?", ["Mefibosete", "Absalão", "Amnom", "Joabe"], 0, "Mefibosete tinha cinco anos quando sua ama fugiu com ele, deixou-o cair e ele ficou com deficiência nos pés.", "2 Samuel 4:4"], ["Qual profetisa foi consultada depois que o Livro da Lei foi encontrado no templo durante o reinado de Josias?", ["Débora", "Ana", "Hulda", "Miriã"], 2, "Os oficiais do rei procuraram a profetisa Hulda para consultar o Senhor sobre as palavras do livro.", "2 Reis 22:14–20"], ["Qual profeta comprou um campo enquanto Jerusalém estava cercada pelo exército inimigo?", ["Isaías", "Jeremias", "Ezequiel", "Daniel"], 1, "Jeremias comprou o campo como sinal de esperança de que propriedades voltariam a ser compradas naquela terra.", "Jeremias 32:6–15"], ["Quem desceu de um monte sem perceber que seu rosto estava brilhando?", ["Elias", "Moisés", "Josué", "Arão"], 1, "Depois de falar com Deus no Sinai, o rosto de Moisés resplandecia, embora ele próprio não soubesse.", "Êxodo 34:29"], ["Qual animal falou com Balaão?", ["Uma jumenta", "Um camelo", "Um cavalo", "Uma ovelha"], 0, "Deus abriu a boca da jumenta para falar com Balaão.", "Números 22:28-30"], ["Quem escondeu ídolos na sela de um camelo?", ["Lia", "Raquel", "Miriã", "Rebeca"], 1, "Raquel escondeu os ídolos de Labão.", "Gênesis 31:34"], ["Quem dormia quando ouviu Deus chamar seu nome?", ["Davi", "Eli", "Samuel", "Salomão"], 2, "O menino Samuel ouviu a voz do Senhor.", "1 Samuel 3:2-10"], ["Qual rei consultou a mulher de En-Dor?", ["Davi", "Acabe", "Ezequias", "Saul"], 3, "Saul procurou a mulher de En-Dor.", "1 Samuel 28:7"], ["Quem encontrou mel na carcaça de um leão?", ["Sansão", "Davi", "Gideão", "Esaú"], 0, "Sansão encontrou mel dentro da carcaça.", "Juízes 14:8-9"], ["Quem recebeu uma túnica especial de seu pai?", ["Benjamim", "José", "Judá", "Rúben"], 1, "Jacó deu uma túnica especial a José.", "Gênesis 37:3"], ["Qual profeta foi alimentado por corvos?", ["Eliseu", "Jonas", "Elias", "Amós"], 2, "Os corvos levaram alimento a Elias.", "1 Reis 17:4-6"], ["Quem pediu porção dobrada do espírito de Elias?", ["Samuel", "Isaías", "Jeremias", "Eliseu"], 3, "Eliseu fez esse pedido antes da partida de Elias.", "2 Reis 2:9"], ["Qual rei viu uma escrita misteriosa na parede?", ["Belsazar", "Dario", "Ciro", "Nabucodonosor"], 0, "A escrita apareceu no banquete de Belsazar.", "Daniel 5:5"], ["Quem passou três dias no ventre de um grande peixe?", ["Noé", "Jonas", "Elias", "Moisés"], 1, "Jonas permaneceu no ventre do peixe.", "Jonas 1:17"], ["Qual profeta viu um vale de ossos secos?", ["Isaías", "Daniel", "Ezequiel", "Oséias"], 2, "Ezequiel teve uma visão de ossos que receberam vida.", "Ezequiel 37:1-10"], ["Qual rainha arriscou a vida diante do rei?", ["Débora", "Rute", "Abigail", "Ester"], 3, "Ester se apresentou sem ser chamada para interceder por seu povo.", "Ester 4:16; 5:1-2"], ["Quem viu uma sarça ardendo sem se consumir?", ["Moisés", "Abraão", "Josué", "Arão"], 0, "Deus falou com Moisés do meio da sarça.", "Êxodo 3:2-4"], ["Quem comprou a primogenitura do irmão por comida?", ["Esaú", "Jacó", "José", "Isaque"], 1, "Esaú vendeu a Jacó seu direito de primogenitura.", "Gênesis 25:29-34"], ["Qual mulher acompanhou Noemi até Belém?", ["Orfa", "Ester", "Rute", "Ana"], 2, "Rute decidiu permanecer com Noemi.", "Rute 1:16-19"], ["Qual homem construiu uma arca antes do dilúvio?", ["Abraão", "Ló", "Enoque", "Noé"], 3, "Deus instruiu Noé a construir uma arca.", "Gênesis 6:13-22"], ["Quem interpretou os sonhos do faraó no Egito?", ["José", "Daniel", "Moisés", "Arão"], 0, "José explicou os sonhos sobre fartura e fome.", "Gênesis 41:25-32"], ["Quem conduziu o povo na travessia do Jordão?", ["Calebe", "Josué", "Moisés", "Gideão"], 1, "Os sacerdotes levaram a arca e o povo atravessou o Jordão.", "Josué 3:14-17"]];
let current=0,score=0;const app=document.getElementById('app');
function render(){const q=questions[current];app.innerHTML=`<div class="eyebrow">Você percebeu isso? Antigo Testamento</div><div class="progress-row"><span>Pergunta ${current+1} de ${questions.length}</span><span>${score} ponto${score===1?'':'s'}</span></div><div class="track"><div class="bar" style="width:${(current+1)/questions.length*100}%"></div></div><h2>${q[0]}</h2><div class="answers">${q[1].map((a,i)=>`<button class="answer" data-i="${i}">${String.fromCharCode(65+i)}) ${a}</button>`).join('')}</div><div class="feedback" aria-live="polite"></div><button class="next">${current===questions.length-1?'Ver resultado':'Próxima pergunta'}</button>`;app.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(+b.dataset.i));app.querySelector('.next').onclick=next}
function answer(i){const q=questions[current],buttons=[...app.querySelectorAll('.answer')];buttons.forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add('correct');else if(n===i)b.classList.add('wrong')});if(i===q[2])score++;const f=app.querySelector('.feedback');f.innerHTML=`<strong>${i===q[2]?'Resposta correta!':'Não foi dessa vez.'}</strong><br>${q[3]}<br><span class="ref">Referência: ${q[4]}.</span>`;f.classList.add('show');app.querySelector('.next').classList.add('show')}
function next(){current++;current<questions.length?render():result()}
function result(){let msg=score<=8?'Continue explorando. A Bíblia está cheia de detalhes surpreendentes.':score<=16?'Você já percebe muitos detalhes das histórias bíblicas.':score<=23?'Excelente! Você conhece muito bem as Escrituras.':score<=29?'Impressionante! Poucos detalhes passam despercebidos por você.':'Olhos de águia bíblicos! Você percebeu tudo!';app.innerHTML=`<div class="result"><div class="eyebrow">Resultado final</div><h1>Você percebeu isso? Antigo Testamento</h1><div class="score-big">${score}/${questions.length}</div><p class="lead">${msg}</p><button class="restart show">Refazer o quiz</button></div>`;app.querySelector('.restart').onclick=()=>{current=0;score=0;render()}}
render();
</script></body></html>
