<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mulheres da Bíblia | Biopsicoeduca</title><style>:root{font-family:Arial,sans-serif;color:#252017;background:#fff9eb}*{box-sizing:border-box}body{margin:0;padding:25px 12px}.wrap{max-width:730px;margin:auto;background:white;border:1px solid #ead9ad;border-radius:18px;padding:26px;box-shadow:0 4px 22px #5a421315}h1{text-align:center;color:#664400;margin:0 0 8px}.sub{text-align:center;color:#6a604e}.bar{height:12px;background:#eee5d1;border-radius:20px;overflow:hidden;margin:22px 0}.fill{height:100%;background:#e9b52a;width:0;transition:width .25s}.meta{display:flex;justify-content:space-between;font-size:14px;color:#645944}h2{font-size:22px;line-height:1.35}.option{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 16px;border:2px solid #e8d9b4;border-radius:10px;background:#fffdf8;color:#201b13;font-size:16px;cursor:pointer}.option:hover:not(:disabled){border-color:#c79720;background:#fff5d6}.option:disabled{cursor:default}.right{background:#e2f5e4!important;border-color:#32914d!important}.wrong{background:#fde5e5!important;border-color:#c94e4e!important}.feedback{padding:15px;border-radius:10px;background:#f8f2e3;margin:18px 0;line-height:1.6}.next{display:block;width:100%;background:#efbe32;border:0;border-radius:10px;padding:14px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:18px}.next:hover{background:#dfac20}.hidden{display:none}.footer{text-align:center;font-size:13px;color:#766950;margin-top:25px}</style></head><body><main class="wrap"><h1>Mulheres da Bíblia</h1><p class="sub">Quiz bíblico interativo | Biopsicoeduca</p><div class="meta"><span id="count">Pergunta 1 de 30</span><span id="score">Acertos: 0</span></div><div class="bar"><div id="fill" class="fill"></div></div><section id="game"><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><button id="next" class="next hidden">Próxima pergunta</button></section><section id="result" class="hidden"><h2 id="final"></h2><p id="message"></p><button class="next" id="restart">Jogar novamente</button></section><p class="footer">Conteúdo educativo • Biopsicoeduca</p></main><script>
const questions=[
{q:'Quem foi a primeira mulher mencionada na Bíblia?',o:['Sara','Eva','Rebeca','Raquel'],a:1,e:'Eva é apresentada como a mulher criada por Deus e companheira de Adão.',v:'Gênesis 2:21-23'},
{q:'Qual mulher se tornou rainha e intercedeu por seu povo?',o:['Ester','Débora','Miriã','Ana'],a:0,e:'Ester arriscou a própria vida ao se apresentar diante do rei em favor dos judeus.',v:'Ester 4:15-16; 7:3-4'},
{q:'Quem era a sogra de Rute?',o:['Noemi','Marta','Isabel','Abigail'],a:0,e:'Rute permaneceu ao lado de Noemi e decidiu acompanhá-la.',v:'Rute 1:16-17'},
{q:'Qual mulher foi mãe de Samuel?',o:['Sara','Ana','Raquel','Lia'],a:1,e:'Ana orou ao Senhor pedindo um filho e deu à luz Samuel.',v:'1 Samuel 1:10-20'},
{q:'Quem foi a mãe de Jesus?',o:['Maria Madalena','Marta','Maria','Isabel'],a:2,e:'Maria recebeu do anjo Gabriel a notícia de que daria à luz Jesus.',v:'Lucas 1:26-31'},
{q:'Quem foi irmã de Moisés e Arão?',o:['Miriã','Débora','Rute','Ester'],a:0,e:'Miriã é identificada como irmã de Arão e participou da história do êxodo.',v:'Êxodo 15:20'},
{q:'Qual mulher foi esposa de Abraão e mãe de Isaque?',o:['Rebeca','Sara','Lia','Raquel'],a:1,e:'Sara deu à luz Isaque em idade avançada, conforme a promessa divina.',v:'Gênesis 21:1-3'},
{q:'Quem era irmã de Marta e de Lázaro?',o:['Maria','Priscila','Lídia','Febe'],a:0,e:'Maria, irmã de Marta e Lázaro, ouviu Jesus aos seus pés.',v:'Lucas 10:38-42; João 11:1-2'},
{q:'Qual mulher ajudou os espias israelitas em Jericó?',o:['Jael','Raabe','Dalila','Hulda'],a:1,e:'Raabe escondeu os espias e pediu proteção para sua família.',v:'Josué 2:1-16'},
{q:'Quem foi a esposa de Isaque?',o:['Raquel','Lia','Rebeca','Sara'],a:2,e:'Rebeca foi escolhida para casar-se com Isaque.',v:'Gênesis 24:67'},
{q:'Qual mulher julgava Israel debaixo de uma palmeira?',o:['Débora','Ester','Miriã','Abigail'],a:0,e:'Débora era profetisa e julgava Israel entre Ramá e Betel.',v:'Juízes 4:4-5'},
{q:'Qual mulher disse a Noemi: “O teu povo é o meu povo”?',o:['Orfa','Rute','Raquel','Tamar'],a:1,e:'Rute expressou sua decisão de acompanhar Noemi e adotar seu povo e seu Deus.',v:'Rute 1:16'},
{q:'Qual mulher recebeu Jesus em sua casa e se preocupou com muitos afazeres?',o:['Marta','Maria Madalena','Lídia','Isabel'],a:0,e:'Marta recebeu Jesus, mas ficou inquieta com as tarefas enquanto Maria o ouvia.',v:'Lucas 10:38-42'},
{q:'Quem era a mãe de João Batista?',o:['Maria','Isabel','Ana','Salomé'],a:1,e:'Isabel, esposa de Zacarias, deu à luz João Batista.',v:'Lucas 1:13; 1:57-60'},
{q:'Qual mulher foi uma vendedora de púrpura que acolheu Paulo?',o:['Febe','Priscila','Lídia','Dorcas'],a:2,e:'Lídia, de Tiatira, ouviu Paulo, foi batizada e o recebeu em sua casa.',v:'Atos 16:14-15'},
{q:'Qual mulher era conhecida também pelo nome de Tabita?',o:['Dorcas','Dâmaris','Junia','Safira'],a:0,e:'Tabita, traduzido como Dorcas, era discípula e praticava boas obras.',v:'Atos 9:36'},
{q:'Qual mulher instruiu Apolo, junto com o marido Áquila?',o:['Febe','Priscila','Eunice','Lóide'],a:1,e:'Priscila e Áquila explicaram a Apolo com mais exatidão o caminho de Deus.',v:'Atos 18:24-26'},
{q:'Qual mulher levou presentes a Davi e evitou um conflito?',o:['Abigail','Bate-Seba','Mical','Hulda'],a:0,e:'Abigail agiu com prudência ao encontrar Davi após a atitude de Nabal.',v:'1 Samuel 25:18-35'},
{q:'Quem reconheceu Jesus como Messias ao conversar com ele junto ao poço?',o:['A mulher samaritana','A viúva de Naim','A mulher cananeia','A filha de Jairo'],a:0,e:'Jesus revelou à samaritana que era o Messias esperado.',v:'João 4:25-26'},
{q:'Qual mulher tocou na roupa de Jesus buscando cura?',o:['A viúva pobre','A mulher com fluxo de sangue','A mulher encurvada','A sogra de Pedro'],a:1,e:'A mulher sofria de hemorragia havia doze anos e foi curada.',v:'Marcos 5:25-34'},
{q:'Qual profetisa foi consultada após a descoberta do Livro da Lei no reinado de Josias?',o:['Débora','Miriã','Hulda','Ana'],a:2,e:'Hulda transmitiu a mensagem do Senhor aos enviados do rei Josias.',v:'2 Reis 22:14-20'},
{q:'Qual mulher matou Sísera usando uma estaca de tenda?',o:['Jael','Débora','Raabe','Rispa'],a:0,e:'Jael acolheu Sísera e, quando ele dormiu, matou-o com uma estaca.',v:'Juízes 4:17-21'},
{q:'Qual mulher vigiou os corpos de seus filhos e de outros executados, afastando aves e animais?',o:['Mical','Rispa','Bate-Seba','Tamar'],a:1,e:'Rispa estendeu pano sobre uma rocha e impediu que aves e animais se aproximassem.',v:'2 Samuel 21:8-10'},
{q:'Qual mulher, ainda menina, falou à esposa de Naamã sobre um profeta em Samaria?',o:['Uma jovem israelita cativa','A filha de Jefté','A filha de Faraó','Uma serva de Sara'],a:0,e:'Uma menina israelita levada cativa indicou que o profeta em Samaria poderia ajudar Naamã.',v:'2 Reis 5:2-3'},
{q:'Qual mulher foi chamada de “mãe em Israel” em seu cântico?',o:['Ana','Débora','Miriã','Ester'],a:1,e:'No cântico de vitória, Débora diz que se levantou como mãe em Israel.',v:'Juízes 5:7'},
{q:'Qual mulher foi mãe de Timóteo?',o:['Lóide','Eunice','Febe','Dâmaris'],a:1,e:'Paulo menciona a fé sincera de Eunice, mãe de Timóteo, e de Lóide, sua avó.',v:'2 Timóteo 1:5'},
{q:'Qual mulher é mencionada por Paulo como serva da igreja em Cencreia?',o:['Febe','Priscila','Lídia','Junia'],a:0,e:'Paulo recomenda Febe à comunidade de Roma e a descreve como serva da igreja em Cencreia.',v:'Romanos 16:1-2'},
{q:'Qual mulher ficou viúva depois de perder o marido e os dois filhos?',o:['Noemi','Rute','Abigail','Marta'],a:0,e:'Noemi perdeu Elimeleque e, posteriormente, seus dois filhos.',v:'Rute 1:3-5'},
{q:'Qual mulher reconheceu o menino Jesus no templo e falava dele aos que aguardavam a redenção?',o:['Isabel','Ana, a profetisa','Maria Madalena','Marta'],a:1,e:'Ana, filha de Fanuel, louvou a Deus e falou do menino aos que esperavam a redenção de Jerusalém.',v:'Lucas 2:36-38'},
{q:'Qual mulher foi a primeira a anunciar aos discípulos que havia visto o Senhor ressuscitado, segundo João?',o:['Maria, mãe de Jesus','Salomé','Maria Madalena','Joana'],a:2,e:'Maria Madalena anunciou aos discípulos que tinha visto o Senhor.',v:'João 20:16-18'}
];let order=[],i=0,points=0,answered=false;const $=id=>document.getElementById(id);function shuffle(a){for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}function start(){order=shuffle(questions.map(x=>({...x,choices:shuffle(x.o.map((t,k)=>({t,correct:k===x.a})))})));i=0;points=0;$('game').classList.remove('hidden');$('result').classList.add('hidden');show()}function show(){answered=false;let x=order[i];$('count').textContent=`Pergunta ${i+1} de ${order.length}`;$('score').textContent=`Acertos: ${points}`;$('fill').style.width=`${i/order.length*100}%`;$('question').textContent=x.q;$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('options').innerHTML='';x.choices.forEach(c=>{let b=document.createElement('button');b.className='option';b.textContent=c.t;b.onclick=()=>answer(c,b);$('options').appendChild(b)})}function answer(c,selected){if(answered)return;answered=true;const x=order[i];if(c.correct)points++;[...$('options').children].forEach((b,k)=>{b.disabled=true;if(x.choices[k].correct)b.classList.add('right');else if(b===selected)b.classList.add('wrong')});$('score').textContent=`Acertos: ${points}`;$('feedback').innerHTML=`<strong>${c.correct?'Resposta correta!':'Não foi dessa vez.'}</strong><p>${x.e}</p><strong>Referência bíblica:</strong> ${x.v}`;$('feedback').classList.remove('hidden');$('next').textContent=i===order.length-1?'Ver resultado':'Próxima pergunta';$('next').classList.remove('hidden')}function next(){i++;if(i>=order.length){$('game').classList.add('hidden');$('result').classList.remove('hidden');$('fill').style.width='100%';$('count').textContent='Quiz concluído';$('final').textContent=`Você acertou ${points} de ${order.length} perguntas!`;$('message').textContent=points>=25?'Excelente! Você conhece muito bem essas histórias.':points>=15?'Muito bem! Continue explorando as histórias dessas mulheres.':'Cada pergunta é uma oportunidade de aprender mais sobre a Bíblia.'}else show()}$('next').onclick=next;$('restart').onclick=start;start();</script></body></html>
