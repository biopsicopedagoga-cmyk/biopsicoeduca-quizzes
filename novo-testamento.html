<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Você percebeu isso? Novo Testamento | Biopsicoeduca</title>
  <meta name="description" content="Quiz dos detalhes bíblicos com 20 perguntas, explicações e referências.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f5b800'/%3E%3Cpath d='M13 17h18c5 0 9 4 9 9v25c-2-3-5-4-9-4H13z' fill='white'/%3E%3Cpath d='M51 17H33c-5 0-9 4-9 9v25c2-3 5-4 9-4h18z' fill='white' opacity='.9'/%3E%3C/svg%3E">
  <style>
    :root{--yellow:#f5b800;--ink:#171717;--muted:#686868;--paper:#fffdf4;--green:#198754;--red:#c83b38}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(145deg,#fff8d6,#fff 55%);color:var(--ink);min-height:100vh}
    .wrap{max-width:760px;margin:auto;padding:22px 16px 36px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px;margin-bottom:20px}.mark{width:38px;height:38px;border-radius:11px;background:var(--yellow);display:grid;place-items:center;font-size:22px}
    .card{background:#fff;border:1px solid #eadfba;border-radius:24px;box-shadow:0 16px 42px #4a3a0018;padding:clamp(22px,5vw,42px)}
    .eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7a5b00}.progress-row{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.92rem;margin:12px 0 8px}.track{height:10px;background:#f1ead2;border-radius:99px;overflow:hidden}.bar{height:100%;width:5%;background:var(--yellow);transition:.3s}
    h1{font-size:clamp(1.65rem,5vw,2.55rem);line-height:1.1;margin:16px 0 8px}h2{font-size:clamp(1.25rem,3.5vw,1.65rem);line-height:1.35;margin:28px 0 18px}.lead{color:var(--muted);line-height:1.55;margin:0 0 24px}
    .answers{display:grid;gap:11px}.answer{width:100%;text-align:left;border:2px solid #e8e1ca;background:#fff;padding:15px 16px;border-radius:14px;font-size:1rem;cursor:pointer;transition:.15s}.answer:hover,.answer:focus{border-color:var(--yellow);outline:none;transform:translateY(-1px)}.answer.correct{border-color:var(--green);background:#eaf8f0}.answer.wrong{border-color:var(--red);background:#fff0ef}.answer:disabled{cursor:default;transform:none;color:var(--ink)}
    .feedback{display:none;margin-top:18px;padding:16px;border-left:5px solid var(--yellow);background:var(--paper);border-radius:10px;line-height:1.5}.feedback.show{display:block}.ref{font-weight:700}.next,.restart{display:none;margin:18px 0 0 auto;border:0;background:var(--ink);color:#fff;padding:13px 20px;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer}.next.show,.restart.show{display:block}.result{text-align:center;padding:12px 0}.score-big{font-size:3.5rem;font-weight:900;color:#9a7100;margin:8px 0}.copyright{margin:22px auto 0;text-align:center;color:#666;font-size:.78rem;line-height:1.45;max-width:650px}
    @media(max-width:520px){.card{border-radius:18px;padding:22px 18px}.answer{padding:14px}}
  </style>
</head>
<body><main class="wrap"><div class="brand"><span class="mark">📖</span>Biopsicoeduca</div><section class="card" id="app"></section><footer class="copyright">Autoria: Profa. Fran Narnib Lorenzon · Biopsicoeduca — 2026<br>© 2026 Biopsicoeduca — Profa. Fran Narnib Lorenzon. Todos os direitos reservados. Proibida a reprodução, redistribuição, adaptação ou comercialização deste material, no todo ou em parte, sem autorização prévia da autora.</footer></main>
<script>
const questions=[["Quem ficou sem conseguir falar até o nascimento de seu filho?", ["José", "Zacarias", "Simeão", "Eli"], 1, "Zacarias duvidou da mensagem do anjo Gabriel e ficou sem falar até o nascimento de João Batista.", "Lucas 1:20, 63–64"], ["Quem adormeceu durante uma longa pregação de Paulo e caiu de uma janela?", ["Trófimo", "Timóteo", "Êutico", "Silas"], 2, "Êutico estava sentado numa janela do terceiro andar, adormeceu e caiu enquanto Paulo falava.", "Atos 20:9"], ["Quem recebeu dos apóstolos um nome que significa “filho da consolação”?", ["Silas", "Barnabé", "Estêvão", "Filipe"], 1, "José, levita natural de Chipre, recebeu dos apóstolos o nome Barnabé.", "Atos 4:36"], ["Qual discípulo também era chamado Dídimo, palavra relacionada a “gêmeo”?", ["André", "Tomé", "Filipe", "Mateus"], 1, "O Evangelho de João identifica Tomé como aquele que era chamado Dídimo.", "João 11:16"], ["Qual profeta amarrou os próprios pés e mãos usando o cinto de Paulo?", ["Ágabo", "Silas", "Judas Barsabás", "Ananias"], 0, "Ágabo usou o cinto de Paulo como demonstração profética do que aconteceria com o apóstolo em Jerusalém.", "Atos 21:10–11"], ["Quem foi obrigado a carregar a cruz de Jesus e é apresentado como pai de Alexandre e Rufo?", ["José de Arimateia", "Simão Pedro", "Simão de Cirene", "Nicodemos"], 2, "Marcos registra esse detalhe familiar ao mencionar Simão de Cirene.", "Marcos 15:21"], ["Qual mulher também era conhecida pelo nome Dorcas?", ["Lídia", "Tabita", "Priscila", "Maria"], 1, "Tabita, discípula conhecida por suas boas obras, também era chamada Dorcas.", "Atos 9:36"], ["Qual cobrador de impostos subiu em uma árvore para conseguir ver Jesus?", ["Bartimeu", "Nicodemos", "Zaqueu", "Jairo"], 2, "Por ser de baixa estatura e por causa da multidão, Zaqueu subiu em um sicômoro para ver Jesus passar.", "Lucas 19:2–4"], ["Quem cortou a orelha do servo do sumo sacerdote?", ["Pedro", "João", "André", "Tomé"], 0, "João identifica Pedro como quem cortou a orelha de Malco.", "João 18:10"], ["Qual era o nome do servo cuja orelha foi cortada?", ["Marcos", "Malco", "Tíquico", "Êutico"], 1, "O servo do sumo sacerdote chamava-se Malco.", "João 18:10"], ["Quem recebeu o apelido de filho da consolação?", ["Silas", "Filipe", "Barnabé", "Estevão"], 2, "Os apóstolos deram esse nome a José.", "Atos 4:36"], ["Quem fugiu deixando um lençol quando Jesus foi preso?", ["Pedro", "João", "Judas", "Um jovem não identificado"], 3, "Marcos menciona um jovem que fugiu deixando o lençol.", "Marcos 14:51-52"], ["Quem explicou melhor as Escrituras a Apolo?", ["Priscila e Áquila", "Ananias e Safira", "José e Maria", "Zacarias e Isabel"], 0, "O casal explicou a Apolo o caminho de Deus com mais precisão.", "Atos 18:26"], ["Quem explicou Isaías ao oficial etíope?", ["Pedro", "Filipe", "Paulo", "Barnabé"], 1, "Filipe explicou a passagem ao eunuco etíope.", "Atos 8:26-35"], ["Quem pediu a Pilatos o corpo de Jesus?", ["Nicodemos", "Simão de Cirene", "José de Arimateia", "Gamaliel"], 2, "José de Arimateia pediu o corpo para sepultá-lo.", "Marcos 15:43"], ["Quem confeccionava roupas para as viúvas?", ["Lídia", "Febe", "Maria", "Tabita"], 3, "As viúvas mostraram roupas feitas por Tabita, também chamada Dorcas.", "Atos 9:36-39"], ["Quem estava debaixo de uma figueira quando Jesus o viu?", ["Natanael", "Tomé", "Mateus", "Tiago"], 0, "Jesus disse que tinha visto Natanael sob a figueira.", "João 1:48"], ["Quem lavou as mãos diante da multidão?", ["Herodes", "Pilatos", "Caifás", "Anás"], 1, "Pilatos lavou as mãos durante o julgamento de Jesus.", "Mateus 27:24"], ["Qual mulher vendia púrpura e hospedou Paulo?", ["Priscila", "Febe", "Lídia", "Damaris"], 2, "Lídia era vendedora de púrpura e acolheu os missionários.", "Atos 16:14-15"], ["Quem reconheceu a voz de Pedro e esqueceu de abrir o portão?", ["Maria", "Lídia", "Marta", "Rode"], 3, "Rode reconheceu Pedro e correu para contar aos outros.", "Atos 12:13-14"], ["Quem escreveu pedindo acolhimento para Onésimo?", ["Paulo", "Pedro", "João", "Tiago"], 0, "Paulo intercedeu por Onésimo junto a Filemom.", "Filemom 1:10-17"], ["Qual apóstolo era conhecido como o Zelote?", ["André", "Simão", "Tiago", "Filipe"], 1, "Simão é identificado como o Zelote.", "Lucas 6:15"], ["Qual discípulo era chamado Cefas?", ["João", "Tiago", "Pedro", "Tomé"], 2, "Jesus deu a Simão o nome Cefas, traduzido como Pedro.", "João 1:42"], ["Quem quis tocar as marcas dos cravos para crer?", ["Filipe", "André", "Mateus", "Tomé"], 3, "Tomé desejava ver e tocar as marcas.", "João 20:24-29"], ["Quem viu um lençol descendo do céu com animais?", ["Pedro", "Paulo", "João", "Filipe"], 0, "Pedro teve essa visão narrada em Atos.", "Atos 10:9-16"], ["Em qual cidade os moradores examinavam diariamente as Escrituras?", ["Atenas", "Bereia", "Corinto", "Éfeso"], 1, "Os bereanos conferiam nas Escrituras o que ouviam.", "Atos 17:10-11"], ["Quem foi deixado em Creta para organizar as igrejas?", ["Timóteo", "Silas", "Tito", "Lucas"], 2, "Paulo deixou Tito em Creta para colocar em ordem o que faltava.", "Tito 1:5"], ["Qual casal mentiu sobre o valor de uma propriedade?", ["Áquila e Priscila", "Zacarias e Isabel", "Filemom e Áfia", "Ananias e Safira"], 3, "Ananias e Safira mentiram sobre o valor entregue.", "Atos 5:1-10"], ["Quem subiu em um sicômoro para ver Jesus?", ["Zaqueu", "Nicodemos", "Jairo", "Mateus"], 0, "Zaqueu subiu na árvore por causa da multidão.", "Lucas 19:4"], ["Quem disse Senhor eu creio depois de ser curado da cegueira?", ["Bartimeu", "O homem que nascera cego", "Zaqueu", "Nicodemos"], 1, "O homem curado declarou sua fé em Jesus.", "João 9:35-38"]];
let current=0,score=0;const app=document.getElementById('app');
function render(){const q=questions[current];app.innerHTML=`<div class="eyebrow">Você percebeu isso? Novo Testamento</div><div class="progress-row"><span>Pergunta ${current+1} de ${questions.length}</span><span>${score} ponto${score===1?'':'s'}</span></div><div class="track"><div class="bar" style="width:${(current+1)/questions.length*100}%"></div></div><h2>${q[0]}</h2><div class="answers">${q[1].map((a,i)=>`<button class="answer" data-i="${i}">${String.fromCharCode(65+i)}) ${a}</button>`).join('')}</div><div class="feedback" aria-live="polite"></div><button class="next">${current===questions.length-1?'Ver resultado':'Próxima pergunta'}</button>`;app.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(+b.dataset.i));app.querySelector('.next').onclick=next}
function answer(i){const q=questions[current],buttons=[...app.querySelectorAll('.answer')];buttons.forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add('correct');else if(n===i)b.classList.add('wrong')});if(i===q[2])score++;const f=app.querySelector('.feedback');f.innerHTML=`<strong>${i===q[2]?'Resposta correta!':'Não foi dessa vez.'}</strong><br>${q[3]}<br><span class="ref">Referência: ${q[4]}.</span>`;f.classList.add('show');app.querySelector('.next').classList.add('show')}
function next(){current++;current<questions.length?render():result()}
function result(){let msg=score<=8?'Continue explorando. A Bíblia está cheia de detalhes surpreendentes.':score<=16?'Você já percebe muitos detalhes das histórias bíblicas.':score<=23?'Excelente! Você conhece muito bem as Escrituras.':score<=29?'Impressionante! Poucos detalhes passam despercebidos por você.':'Olhos de águia bíblicos! Você percebeu tudo!';app.innerHTML=`<div class="result"><div class="eyebrow">Resultado final</div><h1>Você percebeu isso? Novo Testamento</h1><div class="score-big">${score}/${questions.length}</div><p class="lead">${msg}</p><button class="restart show">Refazer o quiz</button></div>`;app.querySelector('.restart').onclick=()=>{current=0;score=0;render()}}
render();
</script></body></html>
